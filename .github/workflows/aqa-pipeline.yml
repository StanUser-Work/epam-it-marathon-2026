name: E2E & API Test Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests (Levels 1-3)
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Application
        working-directory: frontend/restaurant-frontend-app
        run: |
          npm ci
          npm run build

      - name: Install Framework Dependencies & Playwright
        working-directory: aqa/restaurant-aqa-framework
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E & API Tests
        working-directory: aqa/restaurant-aqa-framework
        run: npm run test

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: aqa/restaurant-aqa-framework/playwright-report/
          retention-days: 14